#### Stage 1 Pilot — Job B: Baseline + RetinexLoss only
# Purpose: verify RetinexLoss converges and moves PSNR vs Job A baseline.
#          Active from epoch 1 (phase2_start: 1); blur/phase never activate.
# Run:     python train.py -p options/train/pilot_retinex.yml
#
# What to watch:
#   - loss_retinex should stabilise between 0.01–0.1 (ballpark of pixel loss)
#   - if retinex dominates (>50% of total loss) lower retinex_weight to 0.05
#   - val PSNR should match or beat Job A by ep 50 for a green light

datasets:
  name: LOLBlur
  train:
    low_path:  ./data/datasets/LOLBlur/physir_train/low_blur_noise
    high_path: ./data/datasets/LOLBlur/physir_train/high_sharp_scaled
    crop_size: 256
    batch_size: 4
    n_workers:  4
    use_flips:  True
  val:
    test_path:       ./data/datasets/LOLBlur/physir_val
    batch_size_test: 1
    verbose:         False
    n_workers:       4

network:
  name:               DarkIR
  img_channels:       3
  width:              32
  middle_blk_num_enc: 2
  middle_blk_num_dec: 2
  enc_blk_nums:       [1, 2, 3]
  dec_blk_nums:       [3, 1, 1]
  dilations:          [1, 4, 9]
  extra_depth_wise:   True

save:
  pretrained: null
  path:       ./models/pilot_retinex_latest.pt
  best:       ./models/bests/pilot_retinex_best.pt
  save_freq:  5
  eval_freq:  5
  perceptual_eval_epochs: [10, 30, 50]

pixel_criterion:    l1
perceptual:         False
edge:               True
edge_weight:        0.05
edge_criterion:     l2
edge_reduction:     mean
frequency:          False
enhance:            True
enhance_weight:     0.01
enhance_criterion:  l1
enhance_reduction:  mean

physics_losses:
  enabled:       True
  phase2_start:  1      # RetinexLoss active from epoch 1
  phase3_start:  9999   # BlurAwareGradientLoss never activates in this pilot
  phase4_start:  9999   # PhaseEnhancedFrequencyLoss never activates in this pilot
  retinex:       True
  retinex_weight: 0.10  # sanity weight per guide — adjust if loss scale is off
  blur:          False
  phase:         False

train:
  epochs:        50
  lr_initial:    0.0002
  weight_decay: 0.001   # Match Paper decay
  # weight_decay: 0.00001  betas:         [0.9, 0.9]
  lr_scheme:     CosineAnnealing
  eta_min:       0.000001
  grad_clip:     1.0

wandb:
  init:    False
  project: DarkIR-Physics
  entity:  null
  name:    pilot_B_retinex
  resume:  False
  id:      null
  dir:     ./logs

Resize: False
